<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reiチーム タスクボード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #0f172a;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; }
  header .meta { font-size: 0.75rem; color: #64748b; }
  header .badge {
    margin-left: auto;
    font-size: 0.7rem;
    padding: 4px 10px;
    background: #1e293b;
    border-radius: 20px;
    color: #94a3b8;
  }
  .board {
    display: flex;
    gap: 16px;
    padding: 20px 24px;
    overflow-x: auto;
    align-items: flex-start;
    min-height: calc(100vh - 70px);
  }
  .column {
    min-width: 280px;
    max-width: 280px;
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .column-header {
    padding: 14px 16px;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #0f172a;
  }
  .column-count {
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .column-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: #0f172a;
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #334155;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #475569; }
  .card-title { font-size: 0.85rem; line-height: 1.4; color: #e2e8f0; margin-bottom: 8px; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .owner {
    font-size: 0.7rem;
    padding: 2px 7px;
    background: #1e293b;
    border-radius: 4px;
    color: #94a3b8;
    white-space: nowrap;
  }
  .tag {
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: #1e3a5f;
    color: #93c5fd;
  }
  .deadline {
    font-size: 0.65rem;
    color: #64748b;
    margin-left: auto;
    white-space: nowrap;
  }
  .deadline.urgent { color: #f87171; }
  .done-date { font-size: 0.65rem; color: #4ade80; margin-left: auto; }
  .empty { color: #475569; font-size: 0.8rem; text-align: center; padding: 16px; }
  @media (max-width: 720px) {
    header {
      padding: 14px 16px;
      align-items: flex-start;
    }
    header h1 { font-size: 1rem; }
    header .badge {
      font-size: 0.65rem;
      padding: 3px 8px;
      margin-top: 2px;
    }
    .board {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 12px;
      overflow-x: visible;
    }
    .column {
      min-width: 0;
      max-width: none;
      width: 100%;
      border-radius: 10px;
    }
    .column-header {
      padding: 12px 14px;
      font-size: 0.82rem;
    }
    .column-body {
      padding: 10px;
      gap: 8px;
    }
    .card {
      padding: 10px;
    }
    .card-title {
      font-size: 0.82rem;
    }
    .deadline,
    .done-date {
      margin-left: 0;
      width: 100%;
    }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="board-title">Reiチーム タスクボード</h1>
    <div class="meta" id="board-meta">読み込み中...</div>
  </div>
  <div class="badge" id="board-badge">...</div>
</header>
<div class="board" id="board"></div>

<script>
async function loadBoard() {
  let data;
  try {
    const res = await fetch('kanban.json?_=' + Date.now());
    data = await res.json();
  } catch(e) {
    document.getElementById('board').innerHTML = '<div style="padding:40px;color:#ef4444">kanban.json の読み込みに失敗しました。同じフォルダに kanban.json を置いてください。</div>';
    return;
  }

  document.getElementById('board-title').textContent = data.meta.title;
  document.getElementById('board-meta').textContent = '最終更新: ' + data.meta.updated + ' by ' + data.meta.updatedBy;

  const totalTasks = data.columns.reduce((s, c) => s + c.tasks.length, 0);
  document.getElementById('board-badge').textContent = '全' + totalTasks + 'タスク';

  const board = document.getElementById('board');
  board.innerHTML = '';

  data.columns.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'column';

    const header = document.createElement('div');
    header.className = 'column-header';
    header.style.borderTop = '3px solid ' + col.color;
    header.innerHTML = `<span>${col.label}</span><span class="column-count">${col.tasks.length}</span>`;
    colEl.appendChild(header);

    const body = document.createElement('div');
    body.className = 'column-body';

    if (col.tasks.length === 0) {
      body.innerHTML = '<div class="empty">タスクなし</div>';
    } else {
      col.tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'card';

        const isUrgent = task.deadline && (task.deadline.includes('今日') || task.deadline.includes('進行中'));
        const tagsHtml = (task.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
        const deadlineHtml = task.completedDate
          ? `<span class="done-date">✓ ${task.completedDate}</span>`
          : task.deadline ? `<span class="deadline ${isUrgent ? 'urgent' : ''}">${task.deadline}</span>` : '';

        card.innerHTML = `
          <div class="card-title">${task.title}</div>
          <div class="card-meta">
            <span class="owner">${task.owner}</span>
            ${tagsHtml}
            ${deadlineHtml}
          </div>
        `;
        body.appendChild(card);
      });
    }

    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

loadBoard();
</script>
</body>
</html>
