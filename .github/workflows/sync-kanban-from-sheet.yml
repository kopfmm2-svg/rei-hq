name: Sync Kanban from Google Sheets

on:
  workflow_dispatch:
    inputs:
      sheet_id:
        description: 'Google Spreadsheet ID'
        required: false
        default: '1TrYGE6Z_WfQEJZzpmKeV-rmF4tby5U4zXTJ5o9tEj2I'
      sheet_gid:
        description: 'Google Sheet gid'
        required: false
        default: '661688425'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-kanban-from-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync kanban.json from Google Sheets
        env:
          TASK_SHEET_ID: ${{ github.event.inputs.sheet_id || '1TrYGE6Z_WfQEJZzpmKeV-rmF4tby5U4zXTJ5o9tEj2I' }}
          TASK_SHEET_GID: ${{ github.event.inputs.sheet_gid || '661688425' }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-sheet-to-kanban.mjs
      - name: Commit synced kanban files
        run: |
          if git diff --quiet -- kanban.json; then
            echo "No synced changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanban.json
          git commit -m "Sync kanban from Google Sheets"
          git push
